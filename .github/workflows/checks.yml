name: Pilot checks
on: [push, pull_request]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Exercise PRD 2.1 workflows with synthetic local data
        env:
          DEMO_PASSWORD: Synthetic-CI-Only-2026
          APP_URL: http://127.0.0.1:3000
          LOCAL_DATABASE: 'true'
        run: |
          npm run seed:demo
          npm start > /tmp/istellify.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          node scripts/check-v21.mjs
      - name: Install browser verification tools
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Verify the member screens on desktop and mobile
        env:
          DEMO_PASSWORD: Synthetic-CI-Only-2026
        run: node scripts/check-ui.mjs
      - name: Format changed application sources for review
        run: |
          npx --yes prettier@3.6.2 --write 'app/**/*.{ts,tsx,css}' 'components/**/*.tsx' 'lib/*.ts' 'tests/*.ts' 'scripts/check-v21.mjs' 'scripts/check-ui.mjs'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import cp from 'node:child_process';
          const paths=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const files=Object.fromEntries(paths.map(p=>[p,fs.readFileSync(p,'utf8')]));
          console.log('FORMATTED_SOURCES='+Buffer.from(JSON.stringify(files)).toString('base64'));
          NODE
      - name: Show server diagnostics on failure
        if: failure()
        run: cat /tmp/istellify.log 2>/dev/null || true
